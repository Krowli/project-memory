name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify the tag matches the manifests
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          entry=$(python -c "import json;print(json.load(open('.claude-plugin/marketplace.json'))['plugins'][0]['version'])")
          echo "tag=$tag plugin.json=$manifest marketplace=$entry"
          test "$tag" = "$manifest" || { echo "::error::tag $tag != plugin.json $manifest"; exit 1; }
          test "$tag" = "$entry"    || { echo "::error::tag $tag != marketplace $entry"; exit 1; }
          grep -q "\[$tag\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$tag] section"; exit 1; }

      - name: Extract the changelog section for this version
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\["v"\\]" {f=1; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md > RELEASE_BODY.md
          cat RELEASE_BODY.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file RELEASE_BODY.md
