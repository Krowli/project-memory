name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
        include:
          # 3.9 is the floor because it is what a stock macOS ships, so the
          # floor has to be tested rather than declared. actions/python-versions
          # publishes 3.9 for darwin-x64 but not darwin-arm64 or win32, so the
          # macOS row is the Intel image and there is no Windows row: on Windows
          # a user installs Python anyway and gets a current one. `macos-13` is
          # the wrong label for that Intel image — it is being retired and a job
          # asking for it sits in the queue forever without ever starting, which
          # leaves the whole run incomplete rather than red.
          - os: ubuntu-latest
            python: "3.9"
          - os: macos-15-intel
            python: "3.9"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run tests (FTS5 index path)
        run: pytest
      # Every machine in this matrix has FTS5, so without this the fallback ranker
      # — the one that answers on a read-only store, during a rebuild, or on a
      # Python without sqlite3 — is never executed and rots undetected.
      - name: Run tests (fallback, index disabled)
        env:
          PROJECT_MEMORY_NO_FTS5: "1"
        run: pytest

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  skill-spec:
    name: Agent Skills spec validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # PyPI package `skills-ref` installs a console script named `agentskills`.
      - run: pip install skills-ref
      - run: agentskills validate skills/project-memory

  plugin-manifest:
    name: Claude Code manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      # --strict fails on unrecognized fields and missing metadata.
      - run: claude plugin validate --strict .
