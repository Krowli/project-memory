[project]
name = "project-memory"
version = "0.2.0"
description = "Durable project memory as markdown pages on disk, for coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []          # runtime is stdlib-only, on purpose

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

# Nothing here is importable as a package: the scripts are run by path, and the
# tests reach them through `pythonpath` below. Declaring that explicitly stops
# setuptools auto-discovery, which otherwise sees hooks/, skills/ and tests/ as
# competing top-level packages and refuses to build the project at all.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/project-memory/scripts"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly: ruff's default rule set changes between releases.
select = ["E4", "E7", "E9", "E402", "F", "I", "RUF"]
# RUF001/2/3: the corpus and its fixtures are deliberately bilingual
# (Cyrillic + Latin). Flagging Cyrillic as "ambiguous" is noise here.
ignore = ["RUF001", "RUF002", "RUF003"]
